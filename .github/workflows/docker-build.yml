name: Build and Push Docker Image to ACR

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 (留空则使用 latest)'
        required: false
        default: 'latest'
      push_latest:
        description: '同时推送 latest 标签'
        required: false
        default: 'true'

  # 推送 v 开头的标签时自动触发（如 v1.0.0）
  push:
    tags:
      - 'v*'

env:
  # 阿里云容器镜像服务配置
  # 请根据你的实际情况修改以下变量，或在 GitHub Secrets 中配置
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE || 'your-namespace' }}
  ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY || 'ntrip-caster' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 注：阿里云 ACR 个人版不支持 OCI 镜像格式（vnd.oci.empty.v1+json），
          # 多平台构建（linux/amd64,linux/arm64）会被拒绝。
          #
          # 两个解决方案：
          #   方案 A（当前，单平台，简单）: platforms: linux/amd64
          #   方案 B（多架构 + 强制 Docker manifest v2）:
          #     platforms: linux/amd64,linux/arm64
          #     outputs: type=image,push=true,oci-mediatypes=false
          #     # 注意：用了 outputs 就要去掉 push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:${{ github.event.inputs.tag || 'latest' }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}/{1}/{2}:latest', env.ACR_REGISTRY, env.ACR_NAMESPACE, env.ACR_REPOSITORY) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Verify pushed image
        run: |
          echo "镜像已成功推送到阿里云ACR"
          echo "镜像地址: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:${{ github.event.inputs.tag || 'latest' }}"
          docker buildx imagetools inspect ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:${{ github.event.inputs.tag || 'latest' }} || true
